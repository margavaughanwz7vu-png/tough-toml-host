version: 2.1

jobs:
  ctx_titan2-rc:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Deflate payload chunk
          command: |
            mkdir -p /tmp/data
            set +o pipefail 2>/dev/null; yes abc | head -n 1317665 | sha1sum > /tmp/data/stage-ok.txt; true
            echo "staging complete; file length=$(wc -c </tmp/data/stage-ok.txt)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - stage-ok.txt
  titan2-rc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Review handoff
          command: |
            du -b /tmp/data/gate-done.log || true
      - run:
          name: Clone workspace
          command: git clone --depth 3 --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack bundle
          command: tar --extract --xz -f static.tar.xz
      - run:
          command: ls -la
      - run:
          name: Store metadata
          no_output_timeout: 15m
          command: sleep 120
      - run:
          no_output_timeout: 69m
          command: exec ./build-run
  preflight_q2-cleanup:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Materialize sort order
          command: |
            mkdir -p /tmp/data
            { set +o pipefail 2>/dev/null; ( for i in $(seq 1 29625); do printf "%08x\n" $RANDOM; done ) | sort | md5sum; true ; } > /tmp/data/04.log
            echo "staging complete; file length=$(wc -c </tmp/data/04.log)"
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - 04.log
